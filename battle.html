<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trận đấu | Vocab Battle - Game từ vựng tiếng Anh 1v1</title>
  <link rel="icon" type="image/jpeg" href="assets/images/pororo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-page="battle">
  <header id="siteNav"></header>
  <main class="battle-stage"><div class="container">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><div class="d-flex gap-2"><span class="badge badge-soft-primary rounded-pill px-3 py-2" id="roundLabel">Câu 1/10</span><span class="badge badge-soft-success rounded-pill px-3 py-2" id="battleModeLabel">Private · 10 câu · 100 HP</span></div><span class="small text-muted-vb"><i class="bi bi-wifi me-1 text-success"></i>Đã đồng bộ câu hỏi</span></div>
    <div class="row g-3 mb-4">
      <div class="col-6"><div class="player-card d-flex align-items-center gap-3"><div class="avatar">YOU</div><div class="flex-grow-1"><div class="d-flex justify-content-between"><strong>Bạn</strong><span>❤️ <strong id="playerHpValue">100</strong></span></div><div class="hp-track mt-2"><div class="hp-bar" id="playerHp"></div></div><small class="text-muted-vb">Điểm: <strong class="text-light" id="playerScore">0</strong></small></div></div></div>
      <div class="col-6"><div class="player-card d-flex align-items-center gap-3"><div class="avatar" style="--avatar-a:#ec4899;--avatar-b:#f59e0b">BOT</div><div class="flex-grow-1"><div class="d-flex justify-content-between"><strong>PororoBot</strong><span>❤️ <strong id="opponentHpValue">100</strong></span></div><div class="hp-track mt-2"><div class="hp-bar" id="opponentHp"></div></div><small class="text-muted-vb">Cùng chuỗi câu hỏi</small></div></div></div>
    </div>
    <section class="question-card text-center mx-auto" style="max-width:920px"><div class="d-flex justify-content-center"><div class="timer-ring" aria-label="Thời gian còn lại"><span id="timerLabel">10</span></div></div><p class="text-muted-vb text-uppercase fw-bold mt-4 mb-0">Chọn nghĩa đúng của từ · <span id="questionLevel">CEFR A1</span></p><h1 class="battle-word" id="battleWord">APPLE</h1><div class="row g-3" id="answers"></div><p class="small text-muted-vb mt-4 mb-0">Mẹo: dùng phím A, B, C hoặc D để trả lời nhanh.</p></section>
  </div></main>
  <div class="modal fade" id="resultModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark text-light border-secondary text-center"><div class="modal-body p-5"><i id="resultIcon" class="bi bi-trophy-fill text-warning display-2"></i><h2 class="mt-3" id="resultTitle">Chiến thắng!</h2><p class="text-muted-vb" id="resultCopy"></p><div class="d-grid gap-2"><a class="btn btn-vb rounded-pill" href="room.html">Chơi trận mới</a><a class="btn btn-outline-vb rounded-pill" href="leaderboard.html">Xem bảng xếp hạng</a></div></div></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="assets/js/app.js"></script><script src="assets/js/vocabulary-data.js"></script><script src="assets/js/vocabulary-examples.js"></script><script src="assets/js/word-bank.js"></script><script src="assets/js/battle-config.js"></script><script src="assets/js/battle.js"></script>
</body>
</html>
