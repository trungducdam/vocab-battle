<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho từ vựng | Vocab Battle - Game từ vựng tiếng Anh 1v1</title>
  <link rel="icon" type="image/jpeg" href="assets/images/pororo.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="assets/css/main.css" rel="stylesheet">
</head>
<body data-page="vocabulary">
  <header id="siteNav"></header>
  <main class="site-main">
    <section class="page-hero"><div class="container"><span class="eyebrow">Thư viện kiến thức</span><div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mt-3"><div><h1 class="section-title mb-2">Kho từ vựng</h1></div><div class="d-flex flex-wrap gap-2"><a class="btn btn-outline-vb rounded-pill px-4" href="practice.html"><i class="bi bi-mortarboard me-2"></i>Luyện theo bậc/chủ đề</a><button class="btn btn-outline-vb rounded-pill px-4 d-none" id="uploadWords"><i class="bi bi-cloud-arrow-up me-2"></i>Tải Word/PDF</button><button class="btn btn-vb rounded-pill px-4 d-none" id="addWord"><i class="bi bi-plus-lg me-2"></i>Thêm từ</button></div></div></div></section>
    <section class="pb-5"><div class="container">
      <div class="glass-card">
        <div class="bank-tabs mb-3" role="tablist" aria-label="Chọn kho từ vựng"><button class="bank-tab active" id="publicBankTab" type="button" role="tab"><i class="bi bi-globe2 me-2"></i>Từ vựng chung</button><button class="bank-tab" id="idiomBankTab" type="button" role="tab"><i class="bi bi-chat-quote me-2"></i>Idioms</button><button class="bank-tab" id="personalBankTab" type="button" role="tab"><i class="bi bi-folder2-open me-2"></i>Từ vựng riêng</button></div>
        <div class="row g-3 mb-3"><div class="col-lg-6" id="wordSearchColumn"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="wordSearch" placeholder="Tìm theo từ hoặc nghĩa..."></div></div><div class="col-lg-6" id="levelFilterColumn"><input type="hidden" id="levelFilter" value=""><div class="level-filter-buttons" id="levelFilterButtons" role="group" aria-label="Lọc từ theo cấp độ CEFR"><button class="level-filter-btn active" type="button" data-level="">Tất cả</button><button class="level-filter-btn" type="button" data-level="A1">A1</button><button class="level-filter-btn" type="button" data-level="A2">A2</button><button class="level-filter-btn" type="button" data-level="B1">B1</button><button class="level-filter-btn" type="button" data-level="B2">B2</button><button class="level-filter-btn" type="button" data-level="C1">C1</button><button class="level-filter-btn" type="button" data-level="C2">C2</button></div></div></div>
        <div class="mb-2"><span class="small text-muted-vb" id="wordResultCount">Đang tải từ vựng...</span></div>
        <div id="wordList"></div>
        <div class="d-flex justify-content-center align-items-center mt-4" id="wordPagination"></div>
      </div>
    </div></section>
  </main>
  <div id="siteFooter"></div>
  <div class="modal fade" id="wordModal" tabindex="-1" aria-labelledby="wordModalLabel" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark text-light border-secondary"><form id="wordForm" novalidate><div class="modal-header border-secondary"><h2 class="modal-title fs-5" id="wordModalLabel">Thêm từ mới</h2><button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Đóng"></button></div><div class="modal-body"><input type="hidden" name="wordId"><div class="mb-3"><label class="form-label" for="word" id="wordFieldLabel">Từ tiếng Anh</label><input class="form-control" id="word" name="word" required></div><div class="mb-3"><label class="form-label" for="meaning">Nghĩa tiếng Việt</label><input class="form-control" id="meaning" name="meaning" required></div><div class="mb-3"><label class="form-label" for="example">Câu ví dụ</label><textarea class="form-control" id="example" name="example" rows="2" placeholder="I eat an apple every morning."></textarea></div><div class="row g-3"><div class="col-6" id="levelField"><label class="form-label" for="level">Cấp độ CEFR</label><select class="form-select" id="level" name="level" required><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option><option value="C2">C2</option></select></div><div class="col-6" id="categoryField"><label class="form-label" for="category">Loại từ</label><select class="form-select" id="category" name="category" required><option>Danh từ</option><option>Động từ</option><option>Tính từ</option><option>Trạng từ</option></select></div></div></div><div class="modal-footer border-secondary"><button class="btn btn-outline-vb" type="button" data-bs-dismiss="modal">Hủy</button><button class="btn btn-vb" type="submit">Lưu</button></div></form></div></div></div>
  <div class="modal fade" id="importModal" tabindex="-1" aria-labelledby="importModalLabel" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content bg-dark text-light border-info"><form id="importForm"><div class="modal-header border-secondary"><div><span class="badge badge-soft-primary mb-2">Kho từ riêng</span><h2 class="modal-title fs-5" id="importModalLabel">Nhập từ vựng từ Word/PDF</h2></div><button class="btn-close btn-close-white" type="button" data-bs-dismiss="modal" aria-label="Đóng"></button></div><div class="modal-body"><label class="upload-dropzone d-block mb-3" for="vocabularyFile"><i class="bi bi-file-earmark-arrow-up fs-1 text-info"></i><strong class="d-block mt-2">Chọn file DOCX hoặc PDF</strong><small class="text-muted-vb">Tối đa 10 MB. File nên có cột Từ vựng và Nghĩa tiếng Việt.</small></label><input class="visually-hidden" id="vocabularyFile" type="file" accept=".docx,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required><label class="form-label" for="importLevel">Cấp độ mặc định của bộ từ</label><select class="form-select mb-3" id="importLevel"><option value="A1">A1</option><option value="A2">A2</option><option value="B1">B1</option><option value="B2">B2</option><option value="C1">C1</option></select><div class="alert alert-dark small"><strong>Định dạng được nhận diện:</strong><br>• Bảng: STT | Từ vựng | Từ loại | Nghĩa<br>• Mỗi dòng: apple - quả táo</div><div id="importStatus" aria-live="polite"></div></div><div class="modal-footer border-secondary"><button class="btn btn-outline-vb" type="button" data-bs-dismiss="modal">Đóng</button><button class="btn btn-vb" type="submit"><i class="bi bi-cloud-arrow-up me-2"></i>Đọc và thêm từ</button></div></form></div></div></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mammoth@1.10.0/mammoth.browser.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="assets/js/app.js"></script><script src="assets/js/vocabulary-data.js"></script><script src="assets/js/vocabulary-examples.js"></script><script src="assets/js/ielts-band7-data.js"></script><script src="assets/js/ielts-advanced-data.js"></script><script src="assets/js/idiom-data.js"></script><script src="assets/js/word-bank.js"></script><script src="assets/js/vocabulary.js"></script>
</body>
</html>
